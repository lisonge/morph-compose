name: website

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'morph-compose/**'
      - 'morph-playground/**'
      - 'morph-website/**'
      - 'docs/quality.md'
      - 'visual-baselines/**'
      - 'scripts/quality-report.ts'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    env:
      MORPH_SKIP_ANDROID: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: .cache/image
          key: visual-images-v3-${{ runner.os }}-${{ hashFiles('visual-baselines/**/images.json') }}
          restore-keys: visual-images-v3-${{ runner.os }}-

      - name: Run JVM unit tests
        run: ./gradlew.bat :morph-compose:jvmTest :morph-playground:desktopTest --console=plain

      - name: Generate and compare Desktop report
        run: pnpm quality:report

      - run: pnpm build
        env:
          MORPH_REQUIRE_REPORT: '1'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-visual-report
          path: |
            morph-compose/build/reports/tests/
            morph-playground/build/reports/tests/
            morph-playground/build/reports/morph-visual/quick/

      - name: Deploy website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx --allow-build=sharp --allow-build=workerd --allow-build=esbuild wrangler@4
          pages deploy morph-website/dist --project-name=morph-compose
