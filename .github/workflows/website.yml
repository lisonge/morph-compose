name: website

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'morph-compose/**'
      - 'morph-playground/**'
      - 'morph-website/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm build

      - name: Deploy website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx --allow-build=sharp --allow-build=workerd --allow-build=esbuild wrangler@4
          pages deploy morph-website/dist --project-name=morph-compose
